name: vegetable_app
description: "Vegetable App - belanja sayur segar dari petani lokal. Tugas Akhir BTNG 2026 Divisi Mobile (Flutter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ambil data sayur dari API BTNG: https://api-mobile.dnccudinus.org
  http: ^1.2.2
  # Simpan akun, keranjang, pesanan, notifikasi di HP
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
